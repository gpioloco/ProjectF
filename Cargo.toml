[package]
name = "wte"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "Windows Theme Engine, a local desktop theme editor and switcher"

[dependencies]
anyhow = "1"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jsonc-parser = { version = "0.34", features = ["cst"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
yaml-edit = { version = "0.3.6", default-features = false }
serde_yaml_ng = "0.10"
rfd = "0.15.4"
directories = "6"
zip = { version = "4.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Environment", "Win32_System_WindowsProgramming", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
